<style>
/* Layout: one narrow column. Title, a two-week switch, then one tinted panel per day (date block on the left, one card per session inside), so a session never reads as belonging to the next day. Done = solid card with a check, planned = dashed card, to confirm = amber card with a question mark (end time passed, nobody has confirmed), not done = muted card with a cross. A finished session without a fiche is itself the link to the form, with date, type and rank prefilled. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --ink: #0E1C2B;
  --muted: #5A6B7C;
  --line: #DCE3EA;
  --accent: #1F5FD6;
  --accent-ink: #FFFFFF;
  --accent-soft: #E3ECFC;
  --rest: #E8EDF2;
  --hold-bg: #FFF1D6;
  --hold-ink: #7A4A06;
  --ok: #1B7A4B;
  --ok-tick: #FFFFFF;
  --danger: #B3261E;
  --font-display: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1722; --surface: #132231; --ink: #E7EDF3; --muted: #98A9BA; --line: #23384B;
    --accent: #6BA2FF; --accent-ink: #07203F; --accent-soft: #17335A; --rest: #101E2B;
    --hold-bg: #3A2A0B; --hold-ink: #F3C877; --ok: #62D393; --ok-tick: #07241A; --danger: #FF9C94; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1722; --surface: #132231; --ink: #E7EDF3; --muted: #98A9BA; --line: #23384B;
  --accent: #6BA2FF; --accent-ink: #07203F; --accent-soft: #17335A; --rest: #101E2B;
  --hold-bg: #3A2A0B; --hold-ink: #F3C877; --ok: #62D393; --ok-tick: #07241A; --danger: #FF9C94; color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 32px; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 17px; line-height: 1.2; }
p { margin: 0; }

.seg button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.weekhead { display: flex; flex-direction: column; gap: 12px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: var(--rest); border-radius: 12px; }
.seg button {
  min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted);
  font: 600 15px/1.1 var(--font-body); cursor: pointer; padding: 0 8px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.range, .notice { color: var(--muted); font-size: 15px; }

.days { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.day { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: stretch; padding: 8px; background: var(--rest); border: 1px solid var(--line); border-radius: 16px; }
.day .card.rest { background: transparent; padding: 12px 6px; align-self: center; }
.date { display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; padding: 8px 0; color: var(--muted); }
.date .dow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.date .num { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1.1; }
.day.is-today .date { background: var(--accent); }
.day.is-today .date .dow, .day.is-today .date .num { color: var(--accent-ink); }
.slots { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.card.planned { background: transparent; border: 1.5px dashed var(--muted); padding: 11px 13px; }
.card.confirm { border: 1.5px solid var(--hold-ink); padding: 11px 13px; }
.card.skipped { background: transparent; border-color: var(--muted); }
.card.skipped .name { text-decoration: line-through; color: var(--muted); }
.card.rest { background: var(--rest); border-color: transparent; display: block; color: var(--muted); }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.name { font-weight: 600; }
.detail { color: var(--muted); font-size: 15px; }
.ic { display: block; width: 22px; height: 22px; margin-top: 1px; }
.ic svg { display: block; }
.i-fill { fill: var(--ok); }
.i-tick { fill: none; stroke: var(--ok-tick); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.i-dash { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-dasharray: 3.2 3; }
.i-ask { fill: var(--hold-bg); stroke: var(--hold-ink); stroke-width: 1.8; }
.i-q { fill: none; stroke: var(--hold-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i-qdot { fill: var(--hold-ink); }
.i-skip { fill: none; stroke: var(--muted); stroke-width: 1.8; }
.i-x { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }

.tag { font-size: 12px; font-weight: 600; line-height: 1.2; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.tag.f-ok { background: var(--accent-soft); color: var(--accent); }
.tag.f-skip { background: var(--rest); color: var(--muted); }

.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.acts.one { flex-wrap: nowrap; }
.who { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.mode { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 2px 7px; line-height: 1.2; }
.mode.g { background: var(--surface); color: var(--ink); border: 1px solid var(--muted); }
.mode.s { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 44px; border-radius: 10px; font: 600 14px/1.1 var(--font-body); cursor: pointer; padding: 0 12px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); text-decoration: none; white-space: nowrap; }
.btn.fill { background: var(--accent); color: var(--accent-ink); }
.btn.warn { border-color: var(--danger); color: var(--danger); }
.btn.warn.fill { background: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .5; cursor: default; }
.quiet { min-height: 44px; border: 0; background: transparent; color: var(--muted); font: 500 14px var(--font-body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0 6px; }
.quiet.del { color: var(--danger); }
.add .quiet { color: var(--accent); text-decoration: none; font-weight: 600; }
.btn:focus-visible, .quiet:focus-visible, .chips button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.panel { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.panel label, .panel .lab { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 40px; font: 500 14px var(--font-body); padding: 0 14px; border-radius: 999px; background: var(--rest); color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pick { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.pick .chips button { min-height: 36px; }
textarea, input[type="time"] { width: 100%; box-sizing: border-box; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 16px var(--font-body); }
textarea { resize: vertical; min-height: 64px; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.times > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.err { width: 100%; color: var(--danger); font-size: 14px; }
.ask { font-size: 15px; }
.addbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.total { font-size: 14px; color: var(--muted); }
.total.over { color: var(--danger); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(440px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; font-size: 14px; z-index: 5; }

.note { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.note.hold { background: var(--hold-bg); color: var(--hold-ink); }
.foot { font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .seg button { transition: background .15s; } }
</style>

<div class="wrap">
  <h1>Ma semaine</h1>

  <section class="weekhead">
    <div class="seg" id="seg" role="group" aria-label="Choisir la semaine"></div>
    <p class="range" id="range"></p>
    <p class="total" id="total"></p>
    <p class="notice" id="notice" hidden></p>
    <ol class="days" id="days"></ol>
  </section>

  <section class="note hold">
    <h2>On attend</h2>
    <p>Service, smash et gestes au-dessus de la tête : pas encore. Papa te dit quand ça reprend.</p>
    <p>Ton épaule décide : tu peux t’arrêter ou sauter une séance, sans te justifier.</p>
  </section>

  <p class="foot" id="foot"></p>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* Données : on modifie seulement ce bloc quand le planning change.
   statut : 'done' = fait, 'planned' = prévu, 'skipped' = annulée (motif en 7ᵉ argument de S : « origine · texte libre », ex. « Le coach · pluie »).
   Arguments de S : type, mode ('groupe' | 'spécifique' | null), début, fin, statut, fiche, motif, sid (identifiant de la soumission Jotform, pour « Modifier la fiche »).
   Une séance 'planned' dont l’heure de fin est passée s’affiche « à confirmer » toute seule : jamais « faite » par défaut (decisions.md 2026-10-18 (deuxième)).
   fiche : 'ok' quand la fiche est reçue (registre des séances, marque Jotform). Toute séance terminée à partir de
   FORM_FROM sans 'ok' affiche le bouton « Remplir la fiche », qui ouvre le formulaire. Heures : 'HH:MM', ou 'dur' si l’heure n’est pas fixée. */
const UPDATED = '2026-10-20';
const FORM_URL = 'https://form.jotform.com/262845609478068';
const FORM_FROM = '2026-10-15'; /* mise en service du formulaire */
const NO_FICHE = { mental: true, kine: true }; /* types sans fiche : ni étiquette ni lien (Mourad, 2026-10-16, pour l’instant) */
const DONE = 'done', PLAN = 'planned', SKIP = 'skipped';
const S = (type, mode, start, end, status, fiche, motif, sid) => ({ type, mode, start, end, status, fiche, motif, sid });
const P = (type, dur) => ({ type, dur, status: PLAN });
const WEEKS = [
  { from: '2026-10-12', label: 'Semaine dernière',
    days: [
      [S('tennis', 'groupe', '18:00', '19:00', DONE), S('physique', 'groupe', '19:30', '20:30', DONE)],
      [S('mental', 'groupe', '18:00', '19:00', DONE)],
      [S('tennis', 'groupe', '18:00', '19:00', DONE), S('physique', 'groupe', '19:30', '20:30', DONE)],
      [S('tennis', 'groupe', '10:30', '11:30', DONE, 'ok'), S('physique', 'spécifique', '12:30', '13:30', DONE, 'ok')],
      [S('tennis', 'groupe', '18:00', '19:00', DONE, 'ok'), S('physique', 'groupe', '19:30', '20:30', DONE, 'ok')],
      [S('tennis', 'spécifique', '09:00', '10:00', DONE, 'ok'), S('physique', 'spécifique', '13:00', '14:00', DONE, 'ok'), S('kine', null, '15:00', '16:00', DONE)], []
    ] },
  { from: '2026-10-19', label: 'Cette semaine',
    days: [
      [S('physique', 'groupe', '18:30', '19:30', DONE, 'ok'), S('tennis', null, '19:30', '21:00', DONE, 'ok')],
      [S('physique', null, '15:30', '16:30', DONE, 'ok'), S('mental', null, '18:30', '19:30', SKIP, null, 'Annulée par le club'), S('tennis', null, '19:30', '21:00', SKIP, null, 'Le coach · Pluie')],
      [S('kine', null, '13:00', '14:00', PLAN), S('physique', 'groupe', '18:30', '19:30', PLAN), S('tennis', 'groupe', '19:30', '21:00', PLAN)],
      [S('tennis', null, '19:30', '21:00', PLAN)],
      [S('physique', null, '18:30', '19:30', PLAN), S('tennis', 'groupe', '19:30', '21:00', PLAN)], [], []
    ] }
];

/* Dates : jour civil local, sans heure. */
const DOW = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const DOW_LONG = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const longDate = s => { const d = parse(s); return DOW_LONG[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; };
const rangeLabel = from => {
  const a = parse(from), b = parse(addDays(from, 6));
  return a.getMonth() === b.getMonth()
    ? a.getDate() + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()]
    : a.getDate() + ' ' + MONTHS[a.getMonth()] + ' – ' + b.getDate() + ' ' + MONTHS[b.getMonth()];
};
/* Semaine à ouvrir : celle qui contient aujourd'hui, sinon la plus proche. */
function pickWeek(weeks, today) {
  for (let i = 0; i < weeks.length; i++) if (today >= weeks[i].from && today <= addDays(weeks[i].from, 6)) return { index: i, where: 'in' };
  return today < weeks[0].from ? { index: 0, where: 'before' } : { index: weeks.length - 1, where: 'after' };
}

/* Séances */
const TYPES = { tennis: 'Tennis', physique: 'Physique', mental: 'Mental', kine: 'Kiné' };
const MODES = { 'groupe': 'Groupe', 'spécifique': 'Spécifique' };
/* Formulaire : noms uniques des champs et textes exacts des options (lus sur le formulaire en ligne le 2026-10-16).
   Un type absent d'ici (mental) n'est pas prérempli ; au-delà de deux séances le même jour, le rang non plus. */
const FORM_TYPE = { tennis: 'Tennis (entraînement)', physique: 'Physique' };
const FORM_RANK = { 1: ["La seule aujourd'hui"], 2: ["La 1ère séance aujourd'hui", "La 2ème séance aujourd'hui"] };
function ficheUrl(day, s, k, n) {
  const d = parse(day);
  const q = ['q3_datetime1[day]=' + d.getDate(), 'q3_datetime1[month]=' + (d.getMonth() + 1), 'q3_datetime1[year]=' + d.getFullYear()];
  if (FORM_TYPE[s.type]) q.push('q4_radio2=' + encodeURIComponent(FORM_TYPE[s.type]));
  if (FORM_RANK[n]) q.push('q6_radio4=' + encodeURIComponent(FORM_RANK[n][k]));
  return FORM_URL + '?' + q.join('&');
}
const mins = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtT = t => { const [h, m] = t.split(':').map(Number); return h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : ''); };
const detail = s => s.start ? fmtT(s.start) + ' – ' + fmtT(s.end) : s.dur;
let nowMin = 0, todayIso = '';
function clock() { const n = new Date(); nowMin = n.getHours() * 60 + n.getMinutes(); todayIso = iso(n); }
clock();
/* Heure de fin passée : jour antérieur, ou aujourd'hui après l'heure de fin (sans heure de fin, le jour doit être fini). */
const pastEnd = (day, s) => day < todayIso || (day === todayIso && !!s.end && nowMin > mins(s.end));
/* Quatre états : fait · annulée · à confirmer (passée, non confirmée) · prévu. */
const stateOf = (day, s) => s.status === DONE ? 'done' : s.status === SKIP ? 'skipped' : pastEnd(day, s) ? 'confirm' : 'planned';

const SVG = inner => '<svg viewBox="0 0 22 22" width="22" height="22" aria-hidden="true">' + inner + '</svg>';
const ICONS = {
  done: SVG('<circle cx="11" cy="11" r="10" class="i-fill"/><path d="M6.5 11.5l3 3 6-6.5" class="i-tick"/>'),
  planned: SVG('<circle cx="11" cy="11" r="9.25" class="i-dash"/>'),
  confirm: SVG('<circle cx="11" cy="11" r="9.6" class="i-ask"/><path d="M8.6 8.9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.2.8-1.2 1.7" class="i-q"/><circle cx="11" cy="15.6" r="1.1" class="i-qdot"/>'),
  skipped: SVG('<circle cx="11" cy="11" r="9.6" class="i-skip"/><path d="M7.5 7.5l7 7M14.5 7.5l-7 7" class="i-x"/>')
};
const LABELS = { done: 'Fait', planned: 'Prévu', confirm: 'À confirmer', skipped: 'Annulée' };

/* Affichage */
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const needsFiche = (day, s, st) => !NO_FICHE[s.type] && s.fiche !== 'ok' && day >= FORM_FROM && (st === 'done' || st === 'confirm');
/* « Modifier la fiche » : seulement le jour même, avant le passage de la routine du soir (21 h 15), qui lit la fiche une fois
   (decisions.md 2026-10-20 (neuvième)). Sans identifiant de soumission (fiche lue par la routine), pas de lien. */
const EDIT_URL = 'https://www.jotform.com/edit/';
const EDIT_UNTIL = 21 * 60 + 15;
const canEdit = (day, s) => s.fiche === 'ok' && !!s.sid && day === todayIso && nowMin < EDIT_UNTIL;

/* Modifier le planning depuis la page. Les boutons d'écriture n'existent que si la clé est dans le navigateur :
   on l'y met une fois en ouvrant le lien « …/#k=<clé> » (decisions.md 2026-10-20 (cinquième) à (neuvième)).
   La clé n'est jamais écrite dans ce fichier ni dans la copie publique. L'envoi part vers le relais, qui lance la règle
   « Séance confirmée » : la page enregistrée se met à jour quelques instants après. Les plafonds ci-dessous sont aussi
   ceux du script `modifier-planning.py` (qui a le dernier mot) : la page les vérifie d'avance pour le dire à Sarra. */
const CONFIRM_URL = 'https://relais-jotform.mhaddouk.workers.dev/confirmer';
const ORIGINS = ['Le coach', 'Sarra', 'Douleur'];
const MAX_H = 16, MAX_DAY = 2;
let confirmKey = '';
try {
  const m = /[#&]k=([^&]+)/.exec(location.hash);
  if (m) { localStorage.setItem('cle-confirmer', decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname + location.search); }
  confirmKey = localStorage.getItem('cle-confirmer') || '';
} catch (e) { confirmKey = ''; }
const ui = { open: null, origin: '', motif: '', add: null, addType: 'tennis', addMode: 'groupe', start: '19:30', end: '21:00', err: '' };
let failed = null, toastTimer;
const keyOf = (day, s) => day + s.type + s.start;
const hoursOf = s => (mins(s.end) - mins(s.start)) / 60;
const weekHours = w => w.days.flat().filter(s => s.start && !NO_FICHE[s.type] && s.status !== SKIP).reduce((a, s) => a + hoursOf(s), 0);
/* Même nettoyage que `nettoie` dans modifier-planning.py, pour que la page affiche tout de suite ce qui sera écrit. */
const clean = m => (m || '').replace(/'/g, '’').replace(/"/g, '”').replace(/\\/g, '/').replace(/\(/g, '[').replace(/\)/g, ']').replace(/[<>`\r\n\t]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 120);
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
}
/* Les changements partent un par un, GAP_MS d'écart : la règle GitHub ne garde qu'une exécution en attente derrière celle qui tourne, une rafale de clics en perdrait. */
const GAP_MS = 15000, queue = [];
let busy = false, lastSent = 0;
const queued = key => queue.some(j => j.key === key);
const state = key => { const j = queue.find(x => x.key === key); return j ? (j.started ? 'Envoi…' : 'En attente…') : null; };
function pump() {
  if (busy || !queue.length) return;
  busy = true;
  const j = queue[0];
  setTimeout(() => {
    j.started = true; renderWeek();
    fetch(CONFIRM_URL, { method: 'POST', headers: { 'content-type': 'application/json', 'x-cle': confirmKey }, body: JSON.stringify(j.payload) })
      .then(res => { if (!res.ok) throw new Error(String(res.status)); j.apply(); if (j.message) toast(j.message); })
      .catch(() => { failed = j.key; })
      .finally(() => { queue.shift(); lastSent = Date.now(); busy = false; renderWeek(); pump(); });
  }, Math.max(0, lastSent + GAP_MS - Date.now()));
}
function run(key, payload, apply, message) {
  failed = null; ui.open = null; ui.err = '';
  queue.push({ key, payload, apply, message, started: false });
  renderWeek(); pump();
}
window.addEventListener('beforeunload', e => { if (queue.length) { e.preventDefault(); e.returnValue = ''; } });
const btn = (cls, text, fn) => { const b = el('button', cls, text); b.type = 'button'; b.addEventListener('click', fn); return b; };
const link = (cls, text, href) => { const a = el('a', cls, text); a.href = href; a.target = '_blank'; a.rel = 'noopener'; return a; };
const ident = (day, s) => ({ date: day, type: s.type, start: s.start });

function actions(day, s, st, k, n) {
  if (!s.start) return null;
  const key = keyOf(day, s), box = el('div', 'acts');
  if (queued(key)) { box.appendChild(el('p', 'detail', state(key))); return box; }
  const open = ui.open && ui.open.key === key ? ui.open.kind : null;
  if (open === 'cancel' && confirmKey) {
    const p = el('div', 'panel');
    p.appendChild(el('span', 'lab', 'Qui annule ?'));
    const chips = el('div', 'chips');
    ORIGINS.forEach(o => { const b = btn('', o, () => { ui.origin = o; renderWeek(); }); b.setAttribute('aria-pressed', String(ui.origin === o)); chips.appendChild(b); });
    const lab = el('label', '', 'Motif (facultatif)'); lab.htmlFor = 'motif';
    const ta = el('textarea'); ta.id = 'motif'; ta.maxLength = 120; ta.placeholder = 'Pluie, terrain indisponible, examen demain…'; ta.value = ui.motif;
    ta.addEventListener('input', () => { ui.motif = ta.value; });
    const row = el('div', 'acts');
    const go = btn('btn fill', 'Envoyer', () => {
      const origine = ui.origin, motif = clean(ui.motif);
      run(key, { action: 'annulee', ...ident(day, s), origine, motif }, () => { s.status = SKIP; s.motif = [origine, motif].filter(Boolean).join(' · '); },
        origine === 'Douleur' ? 'Annulée. Papa est prévenu tout de suite.' : 'Annulée. Papa est prévenu.');
    });
    go.disabled = !ui.origin;
    row.append(go, btn('quiet', 'Retour', () => { ui.open = null; renderWeek(); }));
    p.append(chips, lab, ta, row); box.appendChild(p); return box;
  }
  if (open === 'delete' && confirmKey) {
    const p = el('div', 'panel');
    p.appendChild(el('p', 'ask', 'Supprimer cette séance du planning ? Elle disparaît, sans trace sur la page.'));
    const row = el('div', 'acts');
    row.append(btn('btn warn fill', 'Supprimer', () => {
      run(key, { action: 'supprimer', ...ident(day, s) }, () => { const d = WEEKS[current].days; const i = d.findIndex(g => g.includes(s)); d[i] = d[i].filter(x => x !== s); }, 'Séance supprimée. Papa est prévenu.');
    }), btn('btn', 'Garder', () => { ui.open = null; renderWeek(); }));
    p.appendChild(row); box.appendChild(p); return box;
  }
  if (failed === key) box.appendChild(el('p', 'err', 'Envoi impossible. Réessaie, ou préviens Mourad.'));
  if (st === 'skipped') {
    if (confirmKey) box.appendChild(btn('quiet', 'Rétablir la séance', () => run(key, { action: 'retablir', ...ident(day, s) }, () => { s.status = PLAN; delete s.motif; }, 'Séance rétablie.')));
  } else {
    if (NO_FICHE[s.type] && st === 'confirm' && confirmKey) box.appendChild(btn('btn fill', 'Faite', () => run(key, { action: 'faite', ...ident(day, s) }, () => { s.status = DONE; }, 'Marquée faite.')));
    if (needsFiche(day, s, st)) box.appendChild(link('btn fill', 'Remplir la fiche', ficheUrl(day, s, k, n)));
    else if (canEdit(day, s)) box.appendChild(link('btn', 'Modifier la fiche', EDIT_URL + s.sid));
    if (confirmKey && st !== 'done') box.appendChild(btn('btn warn', 'Annulée', () => { ui.open = { key, kind: 'cancel' }; ui.origin = ''; ui.motif = ''; ui.add = null; failed = null; renderWeek(); }));
    if (confirmKey && st === 'planned' && s.fiche !== 'ok') box.appendChild(btn('quiet del', 'Supprimer', () => { ui.open = { key, kind: 'delete' }; ui.add = null; failed = null; renderWeek(); }));
  }
  if (!box.children.length) return null;
  if (!failed) box.classList.add('one');
  return box;
}

/* Groupe ou spécifique, quand le planning ne le dit pas encore. */
function modePick(day, s) {
  const r = el('div', 'pick'); r.appendChild(el('span', 'detail', 'Mode ?'));
  const c = el('div', 'chips');
  Object.keys(MODES).forEach(m => c.appendChild(btn('', MODES[m], () => run(keyOf(day, s), { action: 'mode', ...ident(day, s), mode: m }, () => { s.mode = m; }, 'Mode noté.'))));
  r.appendChild(c); return r;
}

/* k = rang de la séance dans la journée (0, 1…), n = nombre de séances avec fiche ce jour-là. */
function sessionCard(day, s, k, n) {
  const state = stateOf(day, s);
  const card = el('div', 'card ' + state);
  const ic = el('span', 'ic'); ic.setAttribute('role', 'img'); ic.setAttribute('aria-label', LABELS[state]);
  ic.innerHTML = ICONS[state];
  const body = el('div');
  const top = el('div', 'top');
  const who = el('span', 'who'); who.appendChild(el('span', 'name', TYPES[s.type]));
  if (s.mode && MODES[s.mode]) who.appendChild(el('span', 'mode ' + (s.mode === 'groupe' ? 'g' : 's'), MODES[s.mode]));
  top.appendChild(who);
  if (state === 'skipped') top.appendChild(el('span', 'tag f-skip', 'Annulée'));
  else if (!NO_FICHE[s.type] && s.fiche === 'ok') top.appendChild(el('span', 'tag f-ok', 'Fiche reçue'));
  body.append(top, el('p', 'detail', state === 'skipped' && s.motif ? s.motif : detail(s)));
  if (confirmKey && !NO_FICHE[s.type] && s.start && !s.mode && state !== 'skipped') body.appendChild(modePick(day, s));
  const acts = actions(day, s, state, k, n); if (acts) body.appendChild(acts);
  card.append(ic, body);
  return card;
}

function addBox(day, di) {
  const key = 'add' + day;
  const box = el('div', 'addbox'), p = el('div', 'panel'); p.style.marginTop = '0';
  if (queued(key)) { p.appendChild(el('p', 'detail', state(key))); box.appendChild(p); return box; }
  p.appendChild(el('span', 'lab', 'Type'));
  const t = el('div', 'chips');
  Object.keys(TYPES).forEach(x => { const b = btn('', TYPES[x], () => { ui.addType = x; ui.err = ''; renderWeek(); }); b.setAttribute('aria-pressed', String(ui.addType === x)); t.appendChild(b); });
  p.appendChild(t);
  if (!NO_FICHE[ui.addType]) {
    p.appendChild(el('span', 'lab', 'Mode'));
    const m = el('div', 'chips');
    Object.keys(MODES).forEach(x => { const b = btn('', MODES[x], () => { ui.addMode = x; renderWeek(); }); b.setAttribute('aria-pressed', String(ui.addMode === x)); m.appendChild(b); });
    p.appendChild(m);
  }
  const tm = el('div', 'times');
  [['Début', 'start'], ['Fin', 'end']].forEach(([l, f]) => {
    const d = el('div'), lab = el('label', '', l); lab.htmlFor = 'add-' + f;
    const i = el('input'); i.type = 'time'; i.id = 'add-' + f; i.value = ui[f]; i.addEventListener('input', () => { ui[f] = i.value; });
    d.append(lab, i); tm.appendChild(d);
  });
  p.appendChild(tm);
  if (failed === key) ui.err = 'Envoi impossible. Réessaie, ou préviens Mourad.';
  if (ui.err) p.appendChild(el('p', 'err', ui.err));
  const row = el('div', 'acts');
  row.append(btn('btn fill', 'Ajouter', () => {
    const w = WEEKS[current], list = w.days[di], withFiche = !NO_FICHE[ui.addType];
    if (!ui.start || !ui.end || mins(ui.end) <= mins(ui.start)) { ui.err = 'L’heure de fin doit être après le début.'; return renderWeek(); }
    if (list.some(x => x.type === ui.addType && x.start === ui.start)) { ui.err = 'Cette séance existe déjà.'; return renderWeek(); }
    const s = { type: ui.addType, mode: withFiche ? ui.addMode : null, start: ui.start, end: ui.end, status: PLAN };
    if (withFiche && list.filter(x => !NO_FICHE[x.type] && x.status !== SKIP).length >= MAX_DAY) { ui.err = 'Déjà ' + MAX_DAY + ' séances de tennis ou physique ce jour-là.'; return renderWeek(); }
    if (withFiche && weekHours(w) + hoursOf(s) > MAX_H) { ui.err = 'Ça dépasse ' + MAX_H + ' h de tennis et physique cette semaine. Parles-en à Papa.'; return renderWeek(); }
    const payload = { action: 'ajouter', date: day, type: s.type, start: s.start, end: s.end };
    if (withFiche) payload.mode = s.mode;
    run(key, payload, () => { ui.add = null; list.push(s); list.sort((a, b) => (a.start || '99:99').localeCompare(b.start || '99:99')); }, 'Séance ajoutée. Papa est prévenu.');
  }), btn('quiet', 'Retour', () => { ui.add = null; ui.err = ''; renderWeek(); }));
  p.appendChild(row); box.appendChild(p); return box;
}

const start = pickWeek(WEEKS, todayIso);
let current = start.index;

function renderWeek() {
  const w = WEEKS[current];
  const seg = $('seg'); seg.textContent = '';
  WEEKS.forEach((wk, i) => {
    const b = el('button', '', wk.label);
    b.type = 'button'; b.id = 'seg-' + i;
    b.setAttribute('aria-pressed', String(i === current));
    b.addEventListener('click', () => { current = i; ui.open = null; ui.add = null; ui.err = ''; renderWeek(); });
    seg.appendChild(b);
  });
  $('range').textContent = rangeLabel(w.from);
  const h = weekHours(w), total = $('total');
  total.textContent = 'Tennis et physique prévus : ' + String(h).replace('.', ',') + ' h sur ' + MAX_H + ' h.';
  total.className = 'total' + (h > MAX_H ? ' over' : '');
  const notice = $('notice');
  const last = addDays(WEEKS[WEEKS.length - 1].from, 6);
  notice.hidden = start.where === 'in';
  if (start.where === 'after') notice.textContent = 'Le planning s’arrête le ' + longDate(last) + '. Papa le met à jour.';
  if (start.where === 'before') notice.textContent = 'Le planning commence le ' + longDate(WEEKS[0].from) + '.';
  const list = $('days'); list.textContent = '';
  w.days.forEach((sessions, i) => {
    const day = addDays(w.from, i), d = parse(day);
    const li = el('li', 'day' + (day === todayIso ? ' is-today' : ''));
    const date = el('div', 'date'); date.append(el('span', 'dow', DOW[d.getDay()]), el('span', 'num', String(d.getDate())));
    const slots = el('div', 'slots');
    if (sessions.length === 0) slots.appendChild(el('div', 'card rest', 'Repos'));
    else { const fs = sessions.filter(x => !NO_FICHE[x.type]); sessions.forEach(s => slots.appendChild(sessionCard(day, s, fs.indexOf(s), fs.length))); }
    if (confirmKey) {
      if (ui.add === day) slots.appendChild(addBox(day, i));
      else {
        const a = el('div', 'add');
        a.appendChild(btn('quiet', '+ Ajouter une séance', () => { ui.add = day; ui.open = null; ui.err = ''; failed = null; renderWeek(); }));
        slots.appendChild(a);
      }
    }
    li.append(date, slots); list.appendChild(li);
  });
}
$('foot').textContent = 'Mis à jour le ' + longDate(UPDATED) + '.';
renderWeek();
/* Une page laissée ouverte suit l'heure : une séance qui se termine passe « à confirmer » et ouvre sa fiche sans recharger.
   On ne redessine pas pendant qu'un panneau est ouvert, pour ne pas faire perdre le texte en cours de saisie. */
setInterval(() => { clock(); if (!ui.open && ui.add === null && !queue.length) renderWeek(); }, 60000);
</script>
</html>
